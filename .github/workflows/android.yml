name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan di ANDROID_HOME"
            exit 1
          fi
          "$SDKMANAGER" --licenses </dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate all bundled learning books
        shell: bash
        run: |
          set -euo pipefail
          book_dir="app/src/main/assets/books"
          mapfile -t books < <(find "$book_dir" -maxdepth 1 -type f -name '*.txt' | sort)
          count="${#books[@]}"
          test "$count" -ge 40 || { echo "Jumlah buku minimal 40, ditemukan: $count"; exit 1; }
          for book in "${books[@]}"; do
            test -s "$book" || { echo "Naskah kosong: $book"; exit 1; }
            bytes=$(wc -c < "$book")
            test "$bytes" -ge 7500 || { echo "Naskah terlalu pendek: $book ($bytes byte)"; exit 1; }
            grep -Eiq '^BAB[[:space:]]' "$book" || { echo "Struktur bab tidak ditemukan: $book"; exit 1; }
            grep -Eiq '^EVALUASI' "$book" || { echo "Evaluasi belum ditemukan: $book"; exit 1; }
            grep -Eiq '^GLOSARIUM' "$book" || { echo "Glosarium belum ditemukan: $book"; exit 1; }
            echo "OK: $book ($bytes byte)"
          done
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NextyLibrary-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
