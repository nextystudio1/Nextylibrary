<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" rx="28" fill="#f7fafc"/><text x="450" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">Langkah penyelesaian stoikiometri</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="65" y="120" width="220" height="95" rx="18" fill="#dbeafe" stroke="#4b83bd" stroke-width="3"/><text x="175" y="158" font-size="21" font-weight="700" fill="#17324d">1. Setarakan</text><text x="175" y="187" font-size="18" fill="#17324d">persamaan reaksi</text><rect x="340" y="120" width="220" height="95" rx="18" fill="#dcfce7" stroke="#3b9b70" stroke-width="3"/><text x="450" y="158" font-size="21" font-weight="700" fill="#17543d">2. Ubah ke mol</text><text x="450" y="187" font-size="18" fill="#17543d">gunakan massa molar</text><rect x="615" y="120" width="220" height="95" rx="18" fill="#fef3c7" stroke="#d29b32" stroke-width="3"/><text x="725" y="158" font-size="21" font-weight="700" fill="#79510d">3. Bandingkan</text><text x="725" y="187" font-size="18" fill="#79510d">rasio koefisien</text><rect x="205" y="305" width="220" height="95" rx="18" fill="#fce7f3" stroke="#be6797" stroke-width="3"/><text x="315" y="343" font-size="21" font-weight="700" fill="#713653">4. Tentukan</text><text x="315" y="372" font-size="18" fill="#713653">pereaksi pembatas</text><rect x="480" y="305" width="220" height="95" rx="18" fill="#e8e5ff" stroke="#8070ba" stroke-width="3"/><text x="590" y="343" font-size="21" font-weight="700" fill="#40366f">5. Hitung produk</text><text x="590" y="372" font-size="18" fill="#40366f">dan hasil teoritis</text></g><g stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round"><path d="M285 167H325 M310 153L325 167L310 181"/><path d="M560 167H600 M585 153L600 167L585 181"/><path d="M725 220 Q725 265 315 265 V290 M301 275L315 290L329 275"/><path d="M425 352H465 M450 338L465 352L450 366"/></