<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="32" fill="#f6f7fc"/><text x="600" y="58" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="700" fill="#3d4c78">PERSAMAAN DASAR AKUNTANSI</text><g font-family="sans-serif" text-anchor="middle"><rect x="100" y="190" width="270" height="170" rx="22" fill="#e1f0e8" stroke="#75aa8d" stroke-width="5"/><text x="235" y="260" font-size="30" font-weight="700" fill="#32634b">Aset</text><text x="235" y="310" font-size="20" fill="#557968">Sumber daya</text><text x="420" y="290" font-size="48" font-weight="700" fill="#495b7e">=</text><rect x="500" y="190" width="270" height="170" rx="22" fill="#e7edfb" stroke="#8ba2d0" stroke-width="5"/><text x="635" y="260" font-size="30" font-weight="700" fill="#405b91">Liabilitas</text><text x="635" y="310" font-size="20" fill="#60759b">Kewajiban</text><text x="820" y="290" font-size="48" font-weight="700" fill="#495b7e">+</text><rect x="900" y="190" width="220" height="170" rx="22" fill="#fff0dc" stroke="#d5a76c" stroke-width="5"/><text x="1010" y="260" font-size="30" font-weight="700" fill="#936b36">Ekuitas</text><text x="1010" y="310" font-size="20" fill="#987b57">Hak pemilik</text></g><text x="600" y="465" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#46597c">Aset = Liabilitas + Ekuitas</text><text x="600" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#65758e">Setiap transaksi dicatat dengan menjaga keseimbangan persamaan.</text></svg>