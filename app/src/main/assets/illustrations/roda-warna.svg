<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="32" fill="#fbf8f5"/><text x="600" y="58" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="700" fill="#54463f">RODA WARNA DASAR</text><g transform="translate(600 320)"><path d="M0 0V-190A190 190 0 0 1 164.5-95Z" fill="#e85d4a"/><path d="M0 0 164.5-95A190 190 0 0 1 164.5 95Z" fill="#f0bd4d"/><path d="M0 0 164.5 95A190 190 0 0 1 0 190Z" fill="#8ebc67"/><path d="M0 0V190A190 190 0 0 1-164.5 95Z" fill="#4d9d9a"/><path d="M0 0-164.5 95A190 190 0 0 1-164.5-95Z" fill="#5479bd"/><path d="M0 0-164.5-95A190 190 0 0 1 0-190Z" fill="#9874b5"/><circle r="55" fill="#fff" stroke="#ddd" stroke-width="3"/></g><g font-family="sans-serif" font-size="22" fill="#5b4b43"><text x="890" y="185">Warna primer</text><text x="890" y="225" font-size="18">Merah • kuning • biru</text><text x="890" y="315">Warna sekunder</text><text x="890" y="355" font-size="18">Oranye • hijau • ungu</text><text x="890" y="445">Pasangan berlawanan</text><text x="890" y="485" font-size="18">dapat memberi kontras kuat.</text></g><text x="600" y="575" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#78675e">Roda warna membantu merencanakan harmoni dan kontras dalam komunikasi visual.</text></svg>