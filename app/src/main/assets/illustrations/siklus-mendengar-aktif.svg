<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
<title id="t">Siklus mendengar aktif</title><desc id="d">Empat langkah mendengar aktif: memberi perhatian, bertanya untuk klarifikasi, memparafrasakan, dan mengonfirmasi pemahaman.</desc>
<rect width="900" height="500" rx="28" fill="#f7f9fc"/>
<text x="450" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172b4d">SIKLUS MENDENGAR AKTIF</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="70" y="130" width="330" height="112" rx="18" fill="#dceafe" stroke="#3975b9" stroke-width="3"/>
<text x="235" y="174" font-size="25" font-weight="700" fill="#17385e">1. PERHATIKAN</text><text x="235" y="208" font-size="18" fill="#294866">Dengarkan tanpa menyela</text>
<rect x="500" y="130" width="330" height="112" rx="18" fill="#dcf4e9" stroke="#29966a" stroke-width="3"/>
<text x="665" y="174" font-size="25" font-weight="700" fill="#174d3a">2. KLARIFIKASI</text><text x="665" y="208" font-size="18" fill="#285c48">Ajukan pertanyaan terbuka</text>
<rect x="500" y="320" width="330" height="112" rx="18" fill="#fcebd7" stroke="#c78332" stroke-width="3"/>
<text x="665" y="364" font-size="25" font-weight="700" fill="#70451b">3. PARAFRASAKAN</text><text x="665" y="398" font-size="18" fill="#76552f">Ulangi inti pesan dengan kata sendiri</text>
<rect x="70" y="320" width="330" height="112" rx="18" fill="#eee5fa" stroke="#8963b5" stroke-width="3"/>
<text x="235" y="364" font-size="25" font-weight="700" fill="#503776">4. KONFIRMASI</text><text x="235" y="398" font-size="18" fill="#5e4b78">Pastikan pemahaman sudah tepat</text>
<path d="M400 186 H480 M665 242 V300 M500 376 H420 M235 320 V260" fill="none" stroke="#65758b" stroke-width="5" stroke-linecap="round"/>
<path d="M466 174 L482 186 L466 198 M653 284 L665 302 L677 284 M434 364 L418 376 L434 388 M223 274 L235 256 L247 274" fill="none" stroke="#65758b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>