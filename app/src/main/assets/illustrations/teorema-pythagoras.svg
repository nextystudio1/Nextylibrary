<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" rx="28" fill="#f7fafc"/><text x="450" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">Teorema Pythagoras</text><path d="M210 390 L210 150 L530 390 Z" fill="#dbeafe" stroke="#256b9a" stroke-width="6"/><path d="M210 355 H245 V390" fill="none" stroke="#17324d" stroke-width="4"/><text x="185" y="275" text-anchor="end" font-family="Arial,sans-serif" font-size="26" fill="#175b91">a</text><text x="370" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#175b91">b</text><text x="390" y="250" transform="rotate(37 390 250)" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#175b91">c</text><g font-family="Arial,sans-serif" fill="#17324d"><rect x="600" y="135" width="230" height="220" rx="20" fill="#e8f0f7"/><text x="715" y="195" text-anchor="middle" font-size="25" font-weight="700">Hubungan sisi</text><text x="715" y="250" text-anchor="middle" font-size="32">a² + b² = c²</text><text x="715" y="300" text-anchor="middle" font-size="18">c adalah sisi miring</text></g><text x="450" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">Berlaku pada segitiga yang memiliki satu sudut 90°.</text></svg>